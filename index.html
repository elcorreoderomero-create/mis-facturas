<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mis facturas</title><meta name="description" content="Facturas y clientes, con IVA calculado y descarga en PDF."><meta name="theme-color" content="#24374a"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="./favicon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--ink:#24374a;--muted:#697788;--line:#dce2e6;--paper:#fff;--bg:#f3f5f9;--green:#2256cf;--soft:#edf2ff;--amber:#fff6dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 16px;font-weight:600}button:hover{background:#edf1ee}button:disabled{opacity:.5;cursor:default}.primary{background:var(--green);border-color:var(--green);color:white}.primary:hover{background:#1947b3}.link{border:0;background:transparent;padding:5px;color:var(--green)}.small{font-size:13px;padding:7px 12px}.muted{color:var(--muted)}.app{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:28px 18px;display:flex;flex-direction:column}.brand{font-weight:750;font-size:23px;letter-spacing:-1px;padding:0 14px 30px}.brand span{font-size:13px;display:block;font-weight:400;letter-spacing:0;color:#c4cdd6;margin-top:3px}.sidebar nav{display:grid;gap:6px}.sidebar nav button{background:transparent;border:0;text-align:left;color:#d7e0e8;font-weight:500}.sidebar nav button.active,.sidebar nav button:hover{background:#ffffff15;color:#fff}.sidebar footer{margin-top:auto;font-size:12px;padding:18px 12px 0;color:#d7e0e8}.sidebar footer strong{display:block;color:#fff;font-size:14px}.workspace{max-width:1250px;width:100%;margin:auto;padding:35px 42px;align-self:start}h1,h2,h3,p{margin-top:0}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;margin-bottom:7px}h2{font-size:21px;letter-spacing:-.4px}h3{font-size:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:27px}.top p{margin:0}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:25px;margin-bottom:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:25px}.summary .card{margin:0}.summary small{color:var(--muted);font-size:13px}.summary strong{display:block;font-size:25px;letter-spacing:-.6px;margin-top:4px}.empty{text-align:center;padding:64px 25px}.empty-icon{font-size:25px;width:65px;height:65px;background:var(--soft);margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;color:var(--green)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.toolbar input{flex:1;min-width:80px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:17px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.right{text-align:right}.pill{font-size:12px;border-radius:20px;padding:5px 9px;background:var(--amber);color:#866522;white-space:nowrap}.pill.paid{background:var(--soft);color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.span{grid-column:1/-1}label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cfd7dd;background:white;border-radius:8px;padding:11px 12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px #275e4f14}textarea{resize:vertical;min-height:105px}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center;margin-top:24px}.totals{background:var(--soft);border-radius:11px;padding:20px 23px;margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.totals strong{display:block;font-size:23px}.totals small{font-size:12px;color:var(--green)}.notice{border:1px solid #e9dcb8;background:var(--amber);padding:13px 16px;border-radius:9px;font-size:13px;margin-bottom:18px}.notice a{color:inherit}.notice.ok{background:var(--soft);border-color:#d6e3dc}.error{color:#a62828;background:#fff1f1;border:1px solid #f0cccc;padding:12px;border-radius:8px;margin-bottom:15px}.step{font-size:12px;letter-spacing:.8px;color:var(--green);font-weight:700;margin-bottom:10px}.split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:22px}.side-help p{font-size:14px;color:var(--muted)}.side-help ol{padding-left:20px;font-size:14px;color:var(--muted)}.side-help li{margin:14px 0}dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(620px,94vw);max-height:90vh;overflow:auto;color:var(--ink)}dialog::backdrop{background:#10233688}dialog .card{margin:0;border:0}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dialog-head h2{margin:0}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;z-index:20;box-shadow:0 5px 25px #0002;max-width:90vw}#toast:empty{display:none}.storage-status{font-size:12px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;gap:16px}.invoice{background:white;color:#213449;max-width:800px;margin:0 auto;padding:52px 48px;border:1px solid var(--line);border-radius:6px}.invoice-head{display:flex;justify-content:space-between;gap:25px;margin-bottom:32px}.invoice-head h2{font-size:24px;margin-bottom:12px}.invoice p{font-size:13px;margin:2px 0}.invoice .invoice-meta{text-align:right;min-width:150px}.invoice-meta h2{letter-spacing:1px}.invoice-to{border-top:1px solid var(--line);padding-top:22px;margin-bottom:32px}.invoice-to h3{font-size:11px;letter-spacing:1px;color:var(--muted);margin-bottom:12px}.invoice th{background:var(--ink);color:#fff;padding:13px 10px}.invoice td{vertical-align:top;padding:19px 10px;white-space:normal;overflow-wrap:anywhere}.invoice .description{white-space:pre-wrap}.invoice .invoice-totals{width:290px;margin:25px 0 35px auto}.invoice-totals div{display:flex;justify-content:space-between;padding:7px 10px}.invoice-totals .grand{background:var(--ink);color:white;font-weight:700;font-size:19px;margin-top:12px;padding:14px 10px}.invoice-footer{margin-top:34px;overflow-wrap:anywhere}.invoice-notes{white-space:pre-wrap;margin-top:22px!important}.breakable{white-space:pre-wrap;overflow-wrap:anywhere}.save-note{font-size:12px;color:var(--muted);margin-top:12px}.help-line{font-size:13px;color:var(--muted);margin:18px 0}.help-line a{color:var(--green)}.hidden{display:none!important}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;display:block;padding:18px}.brand{padding:0 0 15px}.brand span{display:inline;margin-left:12px}.sidebar nav{display:flex;flex-wrap:wrap;gap:3px}.sidebar nav button{font-size:13px;padding:8px 12px}.sidebar footer{display:none}.workspace{padding:25px 20px}.split{grid-template-columns:1fr}.side-help{display:none}.invoice{padding:30px 25px}}@media(max-width:560px){.top{align-items:flex-start}.top h1{font-size:26px}.top p{font-size:13px}.grid{grid-template-columns:1fr}.summary{gap:8px}.summary .card{padding:13px}.summary strong{font-size:19px}.summary small{font-size:11px}.totals{padding:15px;gap:8px}.totals strong{font-size:19px}.card{padding:19px}.invoice-head{flex-direction:column}.invoice .invoice-meta{text-align:left}.invoice{padding:20px 15px}.invoice th,.invoice td{font-size:11px;padding:10px 6px}.invoice .invoice-totals{width:100%}.storage-status{display:block}.toolbar{flex-wrap:wrap}}
@page{size:A4;margin:15mm}@media print{body{background:white}.sidebar,.no-print,#toast,dialog{display:none!important}.app,.workspace{display:block;margin:0;padding:0;max-width:none}.invoice{border:0;border-radius:0;padding:0;max-width:none;font-size:11pt}.invoice-head{display:flex;flex-direction:row}.invoice .invoice-meta{text-align:right}.invoice-head h2{font-size:20pt}.invoice th,.invoice td{font-size:10pt}tr,.invoice-head,.invoice-to,.invoice-totals,.invoice-footer{break-inside:avoid}.invoice th,.grand{-webkit-print-color-adjust:exact;print-color-adjust:exact}.invoice .invoice-totals{width:290px}a{color:inherit;text-decoration:none}}

.button{display:inline-block;text-decoration:none;border:1px solid var(--green);border-radius:9px;padding:10px 16px;font-weight:600;text-align:center;white-space:nowrap}.button:hover{background:#1947b3;color:white}
@media(max-width:560px){.top{flex-wrap:wrap}.table-wrap table,.table-wrap tbody{display:block}.table-wrap thead{display:none}.table-wrap tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;border-bottom:1px solid var(--line);padding:15px 0}.table-wrap td{display:block;border:0;padding:5px 0;overflow-wrap:anywhere}.table-wrap td:first-child{grid-column:1/-1}.table-wrap td:last-child{grid-column:1/-1;text-align:left}.table-wrap td .small{width:100%;margin-top:8px}.table-wrap tr:last-child{border-bottom:0}.table-wrap{overflow:visible}}
input,select,textarea{font-size:16px}button{min-height:44px}.storage-status{flex-wrap:wrap}.storage-status span{overflow-wrap:anywhere;max-width:100%}</style>
</head>

<div id="root"><main class="workspace"><section class="card"><h1>Mis facturas</h1><p>Cargando la aplicación…</p><noscript>Activa JavaScript en el navegador para utilizar la aplicación.</noscript></section></main></div><dialog id="client-dialog"></dialog><dialog id="confirm-dialog" aria-label="Confirmar acción"></dialog><div id="toast" role="status" aria-live="polite"></div>

</html>
